name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  build-check:
    runs-on: macos-latest

    # 前端构建（tsc + vite + Monaco）会触顶 Node 默认堆上限
    env:
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check Rust backend
        run: cargo check
        working-directory: src-tauri
