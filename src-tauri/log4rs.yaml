refresh_rate: 30 seconds

appenders:
  stdout:
    kind: console
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S)} [{l}] {m}{n}"

  rolling_file:
    kind: rolling_file
    path: logs/app.log
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S)} [{l}] [{f}:{L}] {m}{n}"
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 10mb
      roller:
        kind: fixed_window
        base: 1
        count: 10
        pattern: logs/app.{}.log

root:
  level: info
  appenders:
    - stdout
    - rolling_file
